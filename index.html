<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Package Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 id="h-title"></h1><div class="row"><button class="btn alt" id="themeBtn" aria-label="Light / dark">◐</button><select id="langSel" aria-label="Language"><option value="en">English</option><option value="bn">বাংলা</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></div></header>
<main>
<div id="sum"></div>
<section><h2 id="h1"></h2><button class="btn" id="b-json"></button><input type="file" id="in-json" accept=".json,application/json" hidden><div id="msg1"></div><div id="tender"></div></section>
<section><h2 id="h2"></h2><div id="drop"><p id="dropTxt"></p><button class="btn" id="b-pdf"></button></div><input type="file" id="in-pdf" accept=".pdf,application/pdf" multiple hidden><p class="muted" id="limits"></p><div id="rej"></div><div id="files"></div></section>
<section><h2 id="hLogo"></h2><p class="muted" id="logoHint"></p><div class="row"><button class="btn alt" id="b-logo"></button><button class="btn alt" id="b-logo-rm"></button></div><input type="file" id="in-logo" accept="image/png,image/jpeg" hidden><div id="logoBox"></div></section>
<section><h2 id="hSeal"></h2><p class="muted" id="sealHint"></p><div class="row"><button class="btn alt" id="b-seal"></button><button class="btn alt" id="b-seal-rm"></button></div><input type="file" id="in-seal" accept="image/png" hidden><div id="sealBox"></div></section>
<section><h2 id="h3"></h2><div class="row"><button class="btn alt sm" id="b-auto"></button><button class="btn alt sm" id="b-csv"></button><button class="btn alt sm" id="b-save"></button><button class="btn alt sm" id="b-load"></button><input type="file" id="in-proj" accept=".json,application/json" hidden></div><div class="tbl" id="reqs"></div></section>
<section id="bar"><h2 id="h4"></h2><div id="why"></div><button class="btn" id="gen"></button><p id="out" class="muted"></p></section>
</main>
<script src="app.js"></script>
</body>
</html>
